<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zaal vs Germs</title>
<style>
  html, body { margin: 0; height: 100%; background: #0d0204; color: #f3e6d8;
    font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif; overflow: hidden; }
  #wrap { width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; }
  #stage { position: relative; box-shadow: 0 0 60px rgba(160, 20, 30, .35); }
  #game { display: block; width: 100%; height: 100%; }
  .overlay { position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
    background: rgba(18, 2, 6, .78); z-index: 5; }
  .overlay.show { display: flex; }
  .panel { background: linear-gradient(#3b0c14, #24060b); border: .15em solid #a8323f; border-radius: 1em;
    padding: 1.1em 1.5em; max-width: 46em; box-shadow: 0 .4em 2em rgba(0,0,0,.6); text-align: center; }
  h1 { margin: 0; font-size: 2.6em; letter-spacing: .05em; color: #d7ef6a;
    text-shadow: 0 .08em 0 #3d5a10, 0 0 .5em rgba(190, 230, 60, .4); }
  h2 { margin: .1em 0 .5em; font-size: 1.2em; color: #f2a0a6; font-weight: normal; }
  p { margin: .4em 0; line-height: 1.35; font-size: .95em; }
  .team { display: flex; gap: .8em; justify-content: center; margin: .7em 0; }
  .card { background: rgba(0,0,0,.25); border: .08em solid #6e1f2a; border-radius: .6em; padding: .4em .6em; width: 12em; }
  .card img { width: 4em; height: 4em; display: block; margin: 0 auto; }
  .card > b { color: #ffd88a; display: block; }
  .card > span { font-size: .78em; line-height: 1.3; display: block; }
  .story { width: 40em; min-height: 22em; display: flex; flex-direction: column; }
  #storyBody { flex: 1; text-align: left; }
  #storyBody h1, #storyBody h2 { text-align: center; }
  #storyBody .team { text-align: center; }
  #storyBody ul { margin: .3em 0; padding-left: 1.3em; font-size: .92em; line-height: 1.4; }
  .pics { display: flex; justify-content: center; gap: 1em; }
  .pics img { width: 4.5em; height: 4.5em; }
  .w { color: #ffd88a; border-bottom: .12em dotted #ffd88a; cursor: pointer; }
  .w:hover { background: rgba(255, 216, 138, .15); }
  .pron { color: #c9a9a0; font-size: .85em; font-style: italic; }
  #wordTip { min-height: 2.6em; margin-top: .4em; font-size: .85em; background: rgba(0,0,0,.3); border-radius: .5em;
    padding: .35em .7em; text-align: left; color: #f3e6d8; }
  #wordTip:empty { visibility: hidden; }
  .nav { display: flex; align-items: center; gap: .5em; margin-top: .4em; }
  .nav .go { margin: 0 0 0 auto; }
  #storyDots { flex: 1; text-align: center; color: #a8323f; letter-spacing: .2em; }
  .sec { background: rgba(243, 230, 216, .15); color: #f3e6d8; padding: .35em .8em; border: .08em solid #a8323f; }
  .sec:hover { background: rgba(243, 230, 216, .25); }
  .tip { font-size: .8em; color: #c9a9a0; text-align: center; }
  .mathGrid { display: flex; gap: 1.2em; align-items: stretch; }
  .mrow { display: flex; gap: .4em; justify-content: center; margin: .3em 0; }
  .mrow .go { margin: 0; font-size: 1.05em; padding: .3em 1em; }
  #mathHelp { display: none; width: 21em; max-height: 25em; overflow: auto; text-align: left; background: rgba(0,0,0,.3);
    border-radius: .6em; padding: .5em .8em; font-size: .9em; }
  #mathHelp.show { display: block; }
  #mathHelp p { margin: .35em 0; }
  #mathHelp .steps { font-size: 1.1em; font-weight: bold; color: #fff; }
  #mathHelp .count { color: #d7ef6a; font-weight: bold; }
  #mathHelp .ans { color: #c7e04f; font-size: 1.2em; }
  #mathHelp .tipbox { background: rgba(199, 224, 79, .12); border-left: .25em solid #c7e04f; padding: .25em .5em; border-radius: .3em; }
  .pic { display: flex; flex-wrap: wrap; gap: .25em; align-items: center; margin: .3em 0; }
  .grp { display: inline-flex; flex-wrap: wrap; gap: .15em; border: .1em dashed #f2a0a6; border-radius: .4em; padding: .2em; max-width: 7em; }
  .d { display: inline-block; width: .7em; height: .7em; border-radius: 50%; background: #e2323a; box-shadow: inset -.1em -.1em 0 rgba(0,0,0,.3); }
  .d.g { background: #8ca33a; }
  .d.o { background: none; border: .1em solid #8ca33a; box-sizing: border-box; }
  .d.x { background: #555; position: relative; opacity: .55; }
  .d.x::after { content: '×'; position: absolute; inset: -.35em 0 0 0; text-align: center; color: #fff; font-size: .9em; font-weight: bold; }
  .op { font-size: 1.3em; font-weight: bold; margin: 0 .2em; }
  #glossList { text-align: left; max-height: 22em; overflow: auto; font-size: .85em; columns: 2; column-gap: 1.5em; }
  #glossList div { break-inside: avoid; margin-bottom: .45em; cursor: pointer; }
  #glossList div:hover b { text-decoration: underline; }
  #glossList b { color: #ffd88a; }
  .keys { font-size: .85em; color: #e8c9c0; margin-top: .4em; }
  kbd { background: #f3e6d8; color: #2b070c; border-radius: .25em; padding: 0 .35em; font-family: inherit; font-weight: bold; }
  button { font: inherit; cursor: pointer; border: none; border-radius: .5em; }
  .go { margin-top: .7em; font-size: 1.3em; padding: .4em 1.4em; background: #c7e04f; color: #23360a; font-weight: bold;
    box-shadow: 0 .2em 0 #6d8a1c; }
  .go:active { transform: translateY(.15em); box-shadow: none; }
  #mathWho { color: #ffd88a; font-size: 1.05em; margin-bottom: .3em; }
  #mathQ { font-size: 2.6em; font-weight: bold; margin: .2em 0; color: #fff; }
  #mathA { font-size: 2em; min-width: 4em; display: inline-block; background: #120306; border: .1em solid #a8323f;
    border-radius: .3em; padding: .05em .4em; min-height: 1.2em; color: #d7ef6a; }
  #pad { display: grid; grid-template-columns: repeat(3, 3.2em); gap: .35em; justify-content: center; margin: .6em 0; }
  #pad button { font-size: 1.3em; padding: .35em 0; background: #f3e6d8; color: #2b070c; font-weight: bold; }
  #pad button.ok { background: #c7e04f; color: #23360a; }
  #pad button.del { background: #e8a0a0; }
  #mathMsg { min-height: 1.4em; font-size: 1.1em; font-weight: bold; }
  #mathStars { color: #ffd88a; font-size: .85em; }
  #facts { position: absolute; left: 1%; bottom: 7%; width: 52%; display: flex; flex-direction: column; gap: .3em;
    pointer-events: none; z-index: 3; }
  .fact { background: rgba(20, 40, 10, .88); border-left: .3em solid #c7e04f; border-radius: .4em; padding: .35em .6em;
    font-size: .8em; line-height: 1.3; animation: pop .3s ease-out; }
  .fact b { color: #d7ef6a; }
  @keyframes pop { from { transform: translateY(1em); opacity: 0; } to { transform: none; opacity: 1; } }
  #tools { position: absolute; right: .5%; bottom: .6%; display: flex; gap: .3em; z-index: 4; }
  #tools button { font-size: .7em; padding: .25em .6em; background: rgba(243, 230, 216, .9); color: #2b070c; }
  #endList { text-align: left; font-size: .8em; max-height: 13em; overflow: auto; margin: .5em 0;
    background: rgba(0,0,0,.25); border-radius: .5em; padding: .4em .8em; }
  #endList li { margin: .2em 0; }
  [hidden] { display: none !important; }
  #fly { background: #07040c; z-index: 6; }
  #flyCvs { position: absolute; inset: 0; width: 100%; height: 100%; }
  #flyCap { position: absolute; left: 50%; bottom: 4%; transform: translateX(-50%); width: 70%; background: rgba(20, 4, 10, .85);
    border: .12em solid #a8323f; border-radius: .8em; padding: .6em 1em; font-size: 1.05em; line-height: 1.4; text-align: center; }
  #flyCap:empty { display: none; }
  #flyBtns { position: absolute; right: 1.5%; top: 2.5%; display: flex; gap: .4em; }
  #flyTitle { position: absolute; left: 24%; top: 50%; transform: translate(-50%, -50%); text-align: center; }
  #flyTitle .go { font-size: 1.5em; }
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <canvas id="game" width="960" height="528"></canvas>
    <div id="facts"></div>
    <div id="tools">
      <button id="btnWords">📖 Body words</button>
      <button id="btnRead">🔊 Read aloud: on</button>
      <button id="btnSound">Sound: on</button>
      <button id="btnRestart">Restart level</button>
    </div>

    <div id="fly" class="overlay show">
      <canvas id="flyCvs" width="960" height="528"></canvas>
      <div id="flyTitle">
        <h1>ZAAL vs GERMS</h1>
        <h2>Level 1 · The Bleeding Ulcer</h2>
        <button class="go" id="btnJourney">▶ Start the journey</button>
      </div>
      <div id="flyCap"></div>
      <div id="flyBtns" hidden>
        <button class="sec" id="btnFlyNext">Next ▶</button>
        <button class="sec" id="btnFlySkip">Skip ⏭</button>
      </div>
    </div>

    <div id="intro" class="overlay">
      <div class="panel story">
        <div id="storyBody"></div>
        <div id="wordTip"></div>
        <div class="nav">
          <button class="sec" id="btnBack">◀ Back</button>
          <button class="sec" id="btnReadPage">🔊 Read to me</button>
          <span id="storyDots"></span>
          <button class="go" id="btnNext">Next ▶</button>
        </div>
      </div>
    </div>

    <div id="math" class="overlay">
      <div class="panel mathGrid">
        <div>
          <div id="mathWho"></div>
          <div id="mathQ"></div>
          <div id="mathA"></div>
          <div id="pad"></div>
          <div id="mathMsg"></div>
          <div class="mrow">
            <button class="sec" id="btnHelp">💡 Show me how</button>
            <button class="sec" id="btnHear">🔊 Hear it</button>
            <button class="go" id="btnGotIt" hidden>Got it!</button>
          </div>
          <div id="mathStars"></div>
        </div>
        <div id="mathHelp"></div>
      </div>
    </div>

    <div id="gloss" class="overlay">
      <div class="panel" style="width:40em">
        <h2>📖 Body words</h2>
        <p class="tip">Tap a word to hear it.</p>
        <div id="glossList"></div>
        <button class="go" id="btnGlossClose">Back to the game</button>
      </div>
    </div>

    <div id="end" class="overlay">
      <div class="panel">
        <h1 id="endTitle"></h1>
        <p id="endText"></p>
        <ul id="endList"></ul>
        <button class="go" id="btnAgain">Play again</button>
      </div>
    </div>
  </div>
</div>

<script>
'use strict';
// ---------- constants ----------
const T = 24, COLS = 40, ROWS = 22, W = COLS * T, H = ROWS * T;
const G = 1500, STEP = 1 / 60;
const RBC_TOTAL = 10, RBC_NEED = 7, RBC_SPEED = 38, RBC_GAP = 1.7;
const ACID_START = 75, ACID_RATE = 0.9, ACID_Y0 = 20 * T;
const EXIT = { x: 36 * T, y: 9 * T, w: 3 * T, h: 3 * T };
const SWITCH = { x: 22 * T + 12, y: 14 * T };
const GATE_COL = 26, GATE_TOP = 12, GATE_BOT = 17;

const cvs = document.getElementById('game');
const ctx = cvs.getContext('2d');

// ---------- helpers ----------
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function hash(a, b, c = 0) {
  let h = (a * 374761393 + b * 668265263 + c * 1442695041) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  h ^= h >>> 16;
  return (h >>> 0) / 4294967295;
}
function rr(c, x, y, w, h, r) {
  c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
}
function circle(c, x, y, r) { c.beginPath(); c.arc(x, y, r, 0, Math.PI * 2); c.fill(); }
const overlap = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
const cx = e => e.x + e.w / 2, cy = e => e.y + e.h / 2;

// ---------- body facts ----------
const FACTS = {
  ulcer: 'An <b>ulcer</b> is a sore in the lining of the stomach. Lots of them are caused by the germ <b>H. pylori</b>.',
  hpylori: '<b>H. pylori</b> is spiral-shaped. It spins like a corkscrew to drill into the stomach\'s slimy mucus.',
  ammonia: 'Acid can\'t easily kill <b>H. pylori</b>: it makes a cloud of <b>ammonia</b> around itself as a shield!',
  nobel: 'Barry Marshall <b>drank a cup of H. pylori</b> to prove it makes stomachs sick. He and Robin Warren won a <b>Nobel Prize</b> in 2005.',
  macro: '<b>Macrophage</b> means "big eater" in Greek. They swallow germs whole and digest them inside.',
  split: 'Bacteria multiply by <b>splitting in two</b>. Some kinds can double every 20 minutes!',
  platelet: '<b>Platelets</b> aren\'t whole cells. They\'re tiny fragments that stick together to plug leaks.',
  fibrin: 'Platelets make a plug, then a stringy protein called <b>fibrin</b> weaves a net over it. That\'s a <b>clot</b>!',
  valve: '<b>Veins</b> have little valves inside them, like doors, so blood can\'t flow backwards.',
  nerve: '<b>Nerve signals</b> are electrical. The fastest ones travel over 100 metres per second!',
  rbc: '<b>Red blood cells</b> have no nucleus. That leaves more room for <b>haemoglobin</b>, which carries oxygen.',
  rbcLife: 'A red blood cell lives about <b>120 days</b>. A grown-up has about <b>25 trillion</b> of them!',
  acid: 'Stomach acid is <b>hydrochloric acid</b>. It\'s strong enough to dissolve some metals!',
  mucus: 'Your stomach coats itself in thick <b>mucus</b> so it doesn\'t digest itself.',
};
const seenFacts = new Set();
function fact(key) {
  if (seenFacts.has(key)) return;
  seenFacts.add(key);
  const box = document.getElementById('facts');
  const el = document.createElement('div');
  el.className = 'fact';
  el.innerHTML = '🧠 <b>BODY FACT:</b> ' + FACTS[key];
  box.appendChild(el);
  while (box.children.length > 2) box.removeChild(box.firstChild);
  setTimeout(() => el.remove(), 12000);
  speak('Body fact! ' + FACTS[key]);
}

// ---------- read aloud ----------
let readAloud = 'speechSynthesis' in window, voice = null;
function pickVoice() {
  const vs = speechSynthesis.getVoices().filter(v => v.lang.startsWith('en'));
  voice = vs.find(v => /en-GB/.test(v.lang) && /natural|google|serena|kate|daniel|libby|sonia/i.test(v.name)) ||
    vs.find(v => /en-GB/.test(v.lang)) || vs.find(v => /natural|google|samantha/i.test(v.name)) || vs[0] || null;
}
if ('speechSynthesis' in window) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
// Turn game HTML into something a speech voice reads naturally.
function speechText(html) {
  const el = document.createElement('div');
  el.innerHTML = html;
  el.querySelectorAll('.pron, .pic, .nospeak').forEach(n => n.remove());
  el.querySelectorAll('p, li, div, br, h1, h2').forEach(n => n.after('. '));
  return el.textContent
    .replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}\u{2B50}\u{FE0F}]/gu, '')
    .replace(/ \? /g, ' what number ').replace(/^\? /, 'what number ').replace(/\?(?= [×+])/g, 'what number')
    .replace(/×/g, ' times ').replace(/÷/g, ' divided by ').replace(/−/g, ' minus ').replace(/\+/g, ' plus ')
    .replace(/=/g, ' equals ').replace(/→/g, ', ').replace(/…/g, ', and so on').replace(/·/g, ',')
    .replace(/([.!?:])(\s*\.)+/g, '$1').replace(/(\.\s*){2,}/g, '. ').replace(/\s+/g, ' ').trim();
}
function speak(html, interrupt = false) {
  if (!readAloud || !('speechSynthesis' in window)) return;
  if (interrupt) speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(speechText(html));
  if (voice) u.voice = voice;
  u.rate = .92; u.pitch = 1.05;
  speechSynthesis.speak(u);
  return u;
}
function hush() { if ('speechSynthesis' in window) speechSynthesis.cancel(); }

// ---------- body words ----------
const GLOSS = {
  stomach: ['', 'A stretchy bag in your belly. It squishes food and mixes it with acid.'],
  acid: ['', 'A strong liquid that breaks things down. Stomach acid helps digest food.'],
  digest: ['', 'To break food down into tiny bits your body can use.'],
  mucus: ['MYOO-kus', 'Thick slime, a bit like snot. It coats the stomach so the acid can\'t burn it.'],
  germ: ['', 'A tiny living thing that can make you ill. Far too small to see without a microscope.'],
  bacteria: ['bak-TEER-ee-uh', 'One kind of germ. Each one is just a single tiny cell.'],
  'H. pylori': ['aitch pie-LOR-ee', 'A corkscrew-shaped bacterium that lives in stomachs and can cause ulcers.'],
  ulcer: ['UL-ser', 'A sore in the stomach wall, where the acid has burned through.'],
  cell: ['', 'The tiny building blocks your body is made of. You have trillions of them!'],
  'blood vessel': ['', 'A tube that carries blood around your body.'],
  vein: ['VAYN', 'A blood vessel that carries blood back to your heart.'],
  valve: ['', 'A little door inside a vein. It only lets blood flow one way.'],
  nerve: ['', 'A body wire that carries messages between your brain and the rest of you.'],
  'red blood cell': ['', 'A cell that carries oxygen around your body. Millions of them make blood red.'],
  oxygen: ['OK-si-jen', 'The part of the air your body needs to live. You breathe it in.'],
  'white blood cell': ['', 'A germ-fighting cell. White blood cells are your body\'s army.'],
  macrophage: ['MAK-roh-fayj', 'A big white blood cell that swallows germs whole. The name means "big eater".'],
  platelet: ['PLAYT-let', 'A tiny piece of a cell in your blood. Platelets stick together to plug leaks.'],
  clot: ['', 'A sticky plug made of platelets and stringy fibrin that stops bleeding. A scab is a dried clot!'],
  fibrin: ['FY-brin', 'A stringy protein that weaves a net over a platelet plug to make it strong.'],
  organ: ['', 'A body part with a special job, like your heart, lungs or stomach.'],
  oesophagus: ['ee-SOF-uh-gus', 'The food pipe. A muscly tube that squeezes food down from your mouth to your stomach.'],
  liver: ['', 'A big organ next to your stomach. It cleans your blood and helps digest fat.'],
  'immune system': ['ih-MYOON', 'All the parts of your body that fight germs.'],
};
const glossHTML = k => `<b>${k[0].toUpperCase() + k.slice(1)}</b>${GLOSS[k][0] ? ` <span class="pron">(say "${GLOSS[k][0]}")</span>` : ''}: ${GLOSS[k][1]}`;
function sayWord(k) {
  const tip = document.getElementById('wordTip');
  if (tip) tip.innerHTML = glossHTML(k);
  speak(`${k}. ${GLOSS[k][1]}`, true);
}
// A tappable glossary word for story text.
const Wd = (k, label = k) => `<span class="w" data-w="${k}">${label}</span>`;

// ---------- sound ----------
let actx = null, noiseBuf = null, muted = false;
function ensureAudio() {
  try {
    if (!actx) {
      actx = new (window.AudioContext || window.webkitAudioContext)();
      noiseBuf = actx.createBuffer(1, actx.sampleRate, actx.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    if (actx.state === 'suspended') actx.resume();
  } catch (e) { actx = null; }
}
function tone(f, dur, type = 'sine', vol = .12, to = null, delay = 0) {
  const t0 = actx.currentTime + delay, o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t0);
  if (to) o.frequency.exponentialRampToValueAtTime(to, t0 + dur);
  g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(.001, t0 + dur);
  o.connect(g).connect(actx.destination); o.start(t0); o.stop(t0 + dur + .02);
}
function hiss(dur, vol, freq, delay = 0) {
  const t0 = actx.currentTime + delay, s = actx.createBufferSource(), f = actx.createBiquadFilter(), g = actx.createGain();
  s.buffer = noiseBuf; f.type = 'lowpass'; f.frequency.value = freq;
  g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(.001, t0 + dur);
  s.connect(f).connect(g).connect(actx.destination); s.start(t0); s.stop(t0 + dur + .02);
}
function sfx(name) {
  if (muted || !actx) return;
  switch (name) {
    case 'jump': tone(220, .15, 'square', .05, 520); break;
    case 'gulp': tone(320, .35, 'sine', .25, 60); hiss(.3, .15, 600); break;
    case 'squelch': hiss(.25, .2, 900); tone(140, .2, 'sine', .1, 70); break;
    case 'splat': hiss(.4, .3, 1500); tone(90, .3, 'sawtooth', .06, 40); break;
    case 'right': tone(660, .12, 'triangle', .15); tone(990, .2, 'triangle', .15, null, .1); break;
    case 'wrong': tone(160, .35, 'sawtooth', .08, 110); break;
    case 'build': for (let i = 0; i < 4; i++) { tone(120, .12, 'sine', .2, 70, i * .1); hiss(.1, .12, 500, i * .1); } break;
    case 'zap': tone(1200, .4, 'sawtooth', .06, 80); hiss(.3, .1, 4000); break;
    case 'saved': tone(523, .1, 'sine', .12); tone(784, .15, 'sine', .12, null, .08); break;
    case 'bloop': tone(400, .12, 'sine', .12, 200); break;
    case 'switch': tone(300, .08, 'square', .05); break;
    case 'win': [523, 659, 784, 1047].forEach((f, i) => tone(f, .3, 'triangle', .14, null, i * .15)); break;
    case 'lose': [400, 300, 200].forEach((f, i) => tone(f, .35, 'sawtooth', .07, null, i * .2)); break;
  }
}

// ---------- level ----------
let grid;
function buildGrid() {
  const g = [];
  for (let y = 0; y < ROWS; y++) g.push(new Array(COLS).fill(0));

  for (let x = 9; x <= 12; x++) for (let y = 18; y < ROWS; y++) g[y][x] = 0;     // acid pit
  for (let x = 21; x <= 23; x++) g[14][x] = 1;                                     // nerve ledge

let mathLevel = 2, streak = 0, misses = 0;
const P = (kind, x, y, q, a) => ({ kind, x, y, q, a });
function makeProblem() {
  const L = mathLevel, kinds = [];
  if (L === 1) kinds.push('add10', 'sub20');
  if (L === 2) kinds.push('add30', 'sub30', 'miss20');
  if (L === 3) kinds.push('add100', 'sub100', 'miss20', 'times2510');
  if (L === 4) kinds.push('add2d', 'sub2d', 'times2510', 'timesEasy', 'divEasy');
  if (L === 5) kinds.push('times', 'div', 'missTimes', 'double', 'add2d');
  let a, b;
  switch (pick(kinds)) {
    case 'add10': a = rnd(1, 10); b = rnd(1, 10); return P('add', a, b, `${a} + ${b}`, a + b);
    case 'sub20': a = rnd(6, 20); b = rnd(1, a - 1); return P('sub', a, b, `${a} − ${b}`, a - b);
    case 'add30': a = rnd(5, 20); b = rnd(3, 10); return P('add', a, b, `${a} + ${b}`, a + b);
    case 'sub30': a = rnd(12, 30); b = rnd(3, 11); return P('sub', a, b, `${a} − ${b}`, a - b);
    case 'miss20': a = rnd(3, 12); b = rnd(2, 9); return P('miss', a, a + b, `${a} + ? = ${a + b}`, b);
    case 'add100': a = rnd(2, 8) * 10 + rnd(0, 9); b = pick([rnd(2, 9), rnd(1, 3) * 10]); return P('add', a, b, `${a} + ${b}`, a + b);
    case 'sub100': a = rnd(30, 99); b = pick([rnd(2, 9), rnd(1, 2) * 10]); return P('sub', a, b, `${a} − ${b}`, a - b);
    case 'times2510': a = pick([2, 5, 10]); b = rnd(1, 6); return P('times', b, a, `${b} × ${a}`, a * b);
    case 'timesEasy': a = pick([2, 3, 4, 5, 10]); b = rnd(2, 6); return P('times', b, a, `${b} × ${a}`, a * b);
    case 'divEasy': b = pick([2, 5, 10]); a = rnd(2, 6); return P('div', a * b, b, `${a * b} ÷ ${b}`, a);
    case 'add2d': a = rnd(15, 59); b = rnd(12, 39); return P('add', a, b, `${a} + ${b}`, a + b);
    case 'sub2d': a = rnd(50, 99); b = rnd(12, a - 10); return P('sub', a, b, `${a} − ${b}`, a - b);
    case 'times': a = rnd(2, 10); b = rnd(2, 10); return P('times', a, b, `${a} × ${b}`, a * b);
    case 'missTimes': a = rnd(2, 8); b = pick([2, 3, 4, 5, 10]); return P('missTimes', b, a * b, `? × ${b} = ${a * b}`, a);
    case 'div': a = rnd(2, 10); b = rnd(2, 6); return P('div', a * b, b, `${a * b} ÷ ${b}`, a);
    case 'double': a = rnd(11, 49); return P('double', a, a, `double ${a}`, a * 2);
  }
}

// Step-by-step help for a problem. With reveal=false it teaches the method but leaves the last step to the player.
const D = (n, cls = '') => `<i class="d ${cls}"></i>`.repeat(n);
const upTo = (start, step, n) => Array.from({ length: n }, (_, i) => start + step * (i + 1));
function countLine(list, reveal) {
  return `<p class="count">${reveal ? list.join(', ') : list.slice(0, -1).join(', ') + (list.length > 1 ? ', …' : '…')}</p>`;
}
function groupsPic(groups, each) {
  return groups * each <= 60 ? `<div class="pic">${Array.from({ length: groups }, () => `<span class="grp">${D(each)}</span>`).join('')}</div>` : '';
}
function explain(p, reveal) {
  const A = reveal ? `<b class="ans">${p.a}</b>` : '<b>?</b>';
  const { x, y } = p;
  switch (p.kind) {
    case 'add': {
      if (y <= 10 && x + y <= 30) {
        const big = Math.max(x, y), small = Math.min(x, y);
        return `<p>The <b>+</b> sign means <b>add</b>: put them together.</p>
          <p>Start at the bigger number, <b>${big}</b>, and count on <b>${small}</b> more:</p>
          <div class="pic">${D(big)}<span class="op">+</span>${D(small, 'g')}</div>
          <p>${big} → </p>${countLine(upTo(big, 1, small), reveal)}<p>So ${x} + ${y} = ${A}</p>`;
      }
      const tx = x - x % 10, ox = x % 10, ty = y - y % 10, oy = y % 10;
      return `<p>Big numbers? Split them into <b>tens</b> and <b>ones</b>.</p>
        <p class="steps">${x} = ${tx} + ${ox}<br>${y} = ${ty} + ${oy}</p>
        <p>Add the tens: <span class="steps">${tx} + ${ty} = ${tx + ty}</span></p>
        <p>Add the ones: <span class="steps">${ox} + ${oy} = ${ox + oy}</span></p>
        <p>Put them together: <span class="steps">${tx + ty} + ${ox + oy} = ${A}</span></p>`;
    }
    case 'sub': {
      if (x <= 20) return `<p>The <b>−</b> sign means <b>take away</b>.</p>
        <p>Start with <b>${x}</b>. Cross out <b>${y}</b>. Count what's left!</p>
        <div class="pic">${D(x - y)}${D(y, 'x')}</div><p>So ${x} − ${y} = ${A}</p>`;
      const ty = y - y % 10, oy = y % 10;
      if (!ty) return `<p>The <b>−</b> sign means <b>take away</b>. Count back <b>${y}</b> from <b>${x}</b>:</p>
        <p>${x} → </p>${countLine(upTo(x, -1, y), reveal)}<p>So ${x} − ${y} = ${A}</p>`;
      if (!oy) return `<p>Taking away tens? Only the <b>tens</b> digit changes.</p>
        <p>${x} has ${Math.floor(x / 10)} tens. Take away ${ty / 10} tens:</p>
        <p class="steps">${x} − ${y} = ${A}</p>`;
      return `<p>The <b>−</b> sign means <b>take away</b>. Take away the <b>tens</b> first, then the <b>ones</b>.</p>
        <p class="steps">${y} = ${ty} + ${oy}</p>
        <p>Tens first: <span class="steps">${x} − ${ty} = ${x - ty}</span></p>
        <p>Then the ones: <span class="steps">${x - ty} − ${oy} = ${A}</span></p>`;
    }
    case 'miss':
      return `<p>What do you add to <b>${x}</b> to make <b>${y}</b>?</p>
        <p>Start at ${x} and count up to ${y}. Count how many jumps!</p>
        <div class="pic">${D(x)}<span class="op">+</span>${D(y - x, 'o')}</div>
        <p>${x} → </p><p class="count">${upTo(x, 1, y - x).join(', ')}</p>
        <p>${reveal ? `That's ${A} jumps.` : 'How many jumps was that?'}</p>`;
    case 'times': {
      const tip = y === 10 ? 'Times 10 trick: just put a <b>0</b> on the end!'
        : y === 2 ? 'Times 2 is the same as <b>doubling</b>.'
        : y === 5 ? 'Counting in 5s goes 5, 10, 15, 20… like the minutes on a clock!'
        : x < y ? `Trick: ${x} × ${y} is the same as ${y} × ${x}. Swap them if that's easier!` : '';
      return `<p>The <b>×</b> sign means <b>groups of</b>.</p>
        <p><b>${x} × ${y}</b> means <b>${x} groups of ${y}</b>. How many altogether?</p>
        ${groupsPic(x, y)}
        <p>Count in ${y}s, one jump for each group:</p>${countLine(upTo(0, y, x), reveal)}
        <p>So ${x} × ${y} = ${A}</p>${tip ? `<p class="tipbox">${tip}</p>` : ''}`;
    }
    case 'missTimes':
      return `<p><b>? × ${x} = ${y}</b> asks: <b>how many groups of ${x}</b> make ${y}?</p>
        <p>Count in ${x}s until you reach ${y}, and count the jumps:</p>
        ${groupsPic(p.a, x)}<p class="count">${upTo(0, x, p.a).join(', ')}</p>
        <p>${reveal ? `That's ${A} jumps, so ${A} groups.` : 'How many jumps was that?'}</p>`;
    case 'div':
      return `<p>The <b>÷</b> sign means <b>sharing out equally</b>.</p>
        <p><b>${x} ÷ ${y}</b>: share ${x} into <b>${y} equal groups</b>. How many in each group?</p>
        ${groupsPic(y, p.a)}
        <p class="tipbox">Trick: dividing is the opposite of times! Ask: <b>${y} × what = ${x}</b>? Count in ${y}s until you reach ${x}:</p>
        <p class="count">${upTo(0, y, p.a).join(', ')}</p>
        <p>${reveal ? `That's ${A} jumps, so ${x} ÷ ${y} = ${A}` : 'Count the jumps. That\'s your answer!'}</p>`;
    case 'double': {
      const t = x - x % 10, o = x % 10;
      return `<p><b>Double</b> means add it to itself: <b>${x} + ${x}</b>.</p>
        <p>Split it into tens and ones: <span class="steps">${x} = ${t} + ${o}</span></p>
        <p>Double the tens: <span class="steps">${t} + ${t} = ${t * 2}</span></p>
        <p>Double the ones: <span class="steps">${o} + ${o} = ${o * 2}</span></p>
        <p>Put them together: <span class="steps">${t * 2} + ${o * 2} = ${A}</span></p>`;
    }
  }
}

let mathCtx = null;

function mathKey(k) {

// ---------- powers ----------
function say(e, text, color = '#fff') { floats.push({ x: cx(e), y: e.y - 8, text, color, life: 1.8 }); }
function usePower() {
  const h = heroes[active];
  if (h.inExit) return;
  if (h.id === 'gob') {
    let best = null, bd = 46;
    for (const g of germs) {
      if (g.state !== 'alive') continue;
      const d = Math.hypot(cx(g) - cx(h), cy(g) - cy(h));
      if (d < bd) { bd = d; best = g; }
    }
    if (!best) return say(h, 'No germ close enough!');
    openMath('GULP TIME! Solve it to swallow the germ:', () => {
      best.state = 'eaten'; best.t = 0; h.eatT = .7; h.eaten++; h.facing = cx(best) > cx(h) ? 1 : -1;
      sfx('gulp');
      fact(h.eaten === 1 ? 'macro' : h.eaten === 2 ? 'hpylori' : h.eaten === 3 ? 'ammonia' : 'nobel');
    }, () => {
      if (germs.filter(g => g.state === 'alive').length < 9) {
        const n = makeGerm(0, 0);
        Object.assign(n, { x: best.x + 6, y: best.y - 4, home: best.home, dir: -best.dir });
        germs.push(n);
      }
      for (let i = 0; i < 10; i++) goo(cx(best), cy(best), '#9bb33c');
      sfx('squelch'); say(best, 'It split in two!', '#d7ef6a'); fact('split');
    });
  } else if (h.id === 'patch') {
    const row = Math.floor((h.y + h.h + 2) / T);
    const cells = [];
    if (h.onGround && row < ROWS) {
      let c = Math.floor(cx(h) / T) + h.facing;
      for (let i = 0; i < 7 && cells.length < 4; i++, c += h.facing) {
        if (c <= 0 || c >= COLS - 1) break;
        if (grid[row][c] === 0) cells.push(c);
        else if (cells.length) break;
      }
    }
    if (!cells.length) return say(h, 'Nothing to bridge here!');
    openMath('BUILD A CLOT BRIDGE! Solve it to stick the platelets together:', () => {
      for (const c of cells) {
        grid[row][c] = 2;
        for (let i = 0; i < 6; i++) goo(c * T + 12, row * T + 12, '#7a0d16');
        const tile = { x: c * T, y: row * T, w: T, h: T };
        for (const e of [...heroes, ...rbcs, ...germs]) if (overlap(e, tile)) e.y = row * T - e.h - .01;
      }

    }, () => say(h, 'The platelets slid apart...', '#ffb0b0'));

    if (gateOpen) return say(h, 'The valve is already open!');
    const d = Math.hypot(SWITCH.x - cx(h), SWITCH.y - (h.y + h.h));

    openMath('NERVE SIGNAL! Solve it to zap the valve open:', () => {
      gateOpen = true; nervePulse = 0; sfx('zap'); fact('nerve');
      setTimeout(() => fact('valve'), 2500);
    }, () => say(h, 'Fizzle... try again!', '#ffb0b0'));
  }
}

// ---------- particles ----------
function goo(x, y, color, n = 1) {
  for (let i = 0; i < n; i++)
    parts.push({ x, y, vx: (Math.random() - .5) * 160, vy: -Math.random() * 160, life: .7 + Math.random() * .5, max: 1.2,
      color, size: 2 + Math.random() * 3, grav: 500 });
}
let dripT = 0, ceilTiles = [];

// ---------- update ----------
const keys = {};
let jumpQ = false, powerQ = false;
function update(dt) {
  gameTime += dt;
  // heroes
  heroes.forEach((h, i) => {
    if (h.knockT > 0) { h.knockT -= dt; h.vx = h.knockVx; }
    else if (i === active) {
      const d = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
      h.vx = d * h.speed;
      if (d) h.facing = d;
      if (jumpQ && h.onGround) { h.vy = -h.jumpV; sfx('jump'); }
    } else h.vx = 0;
    moveEntity(h, dt, true);
    if (h.onGround && h.vx) h.walkT += dt; else h.walkT = 0;
    if (h.eatT > 0) h.eatT -= dt;
    h.inExit = overlap({ x: cx(h) - 1, y: cy(h) - 1, w: 2, h: 2 }, EXIT);
    if (h.y + h.h > acidY + 4 || h.y > H) {
      for (let k = 0; k < 20; k++) goo(cx(h), acidY, '#b8d63c');
      sfx('splat');
      if (acidY < 18 * T) return fail(`Oh no! ${h.name} got caught in the acid flood and digested. Yuck!`);
      Object.assign(h, { x: h.spawnX, y: 18 * T - h.h - .01, vx: 0, vy: 0, knockT: 0 });
      say(h, 'Dissolved! Back to the start...', '#d7ef6a');
    }
  });
  jumpQ = false;
  if (powerQ) { powerQ = false; usePower(); }
  if (ended || paused) return;

  // germs
  const gob = heroes[1];
  germs = germs.filter(g => {
    g.phase += dt;
    if (g.state === 'eaten') {
      g.t += dt;
      g.x += (cx(gob) - cx(g)) * Math.min(1, dt * 7);
      g.y += (cy(gob) - cy(g)) * Math.min(1, dt * 7);
      if (Math.random() < .3) goo(cx(g), cy(g), '#9bb33c');
      return g.t < .6;
    }
    g.vx = g.dir * g.speed;
    moveEntity(g, dt, false);
    if (g.hitWall || (g.onGround && !groundAhead(g))) g.dir *= -1;
    if (g.x < g.home - g.range) g.dir = 1;
    if (g.x > g.home + g.range) g.dir = -1;
    for (const h of heroes) {
      if (!overlap(g, h) || h.knockT > 0) continue;
      if (h.id === 'gob') { g.dir = cx(g) < cx(h) ? -1 : 1; continue; }
      h.knockT = .35; h.knockVx = (cx(h) < cx(g) ? -1 : 1) * 150; h.vy = -220;
      sfx('squelch'); say(h, 'Ew, slimy!', '#d7ef6a');
    }
    return g.y < H;
  });

  // red blood cells
  if (released && spawned < RBC_TOTAL) {
    spawnT -= dt;
    if (spawnT <= 0) {
      rbcs.push({ x: 2.5 * T - 7, y: 4.6 * T, w: 14, h: 12, vx: 0, vy: 0, dir: 1, state: 'walk', t: 0, onGround: false, ph: Math.random() * 6 });
      spawned++; spawnT = RBC_GAP; sfx('bloop');
    }
  }
  for (const r of rbcs) {
    r.ph += dt;
    if (r.state === 'walk') {
      r.vx = r.onGround ? r.dir * RBC_SPEED : 0;
      moveEntity(r, dt, true);
      if (r.hitWall) r.dir *= -1;
      for (const h of heroes) {
        if (h.inExit) continue;
        const hb = { x: h.x - 2, y: h.y, w: h.w + 4, h: h.h };
        if (overlap(r, hb) && (cx(h) - cx(r)) * r.dir > 0) r.dir *= -1;
      }
      if (overlap({ x: cx(r) - 1, y: cy(r) - 1, w: 2, h: 2 }, EXIT)) {
        r.state = 'saved'; r.t = 0; saved++; sfx('saved');
        if (saved === 1) fact('rbc');
        if (saved === 5) fact('rbcLife');
      } else if (germs.some(g => g.state === 'alive' && overlap(g, r))) {
        r.state = 'infected'; r.t = 0; lost++; sfx('squelch');
        say(r, 'Infected!', '#d7ef6a');
      } else if (r.y + r.h > acidY + 3 || r.y > H) {
        r.state = 'gone'; lost++; sfx('splat');
        for (let k = 0; k < 12; k++) goo(cx(r), acidY, '#c41a24');
      }
    } else if (r.state === 'saved') {
      r.t += dt; r.x += (EXIT.x + EXIT.w - 10 - r.x) * dt * 3;
      if (r.t > .8) r.state = 'gone';
    } else if (r.state === 'infected') {
      r.t += dt;
      if (r.t > .8) { r.state = 'gone'; for (let k = 0; k < 14; k++) goo(cx(r), cy(r), k % 2 ? '#9bb33c' : '#c41a24'); sfx('splat'); }
    }
  }
  rbcs = rbcs.filter(r => r.state !== 'gone');

  // valve, acid, ambience
  if (gateOpen) gateAnim = Math.min(1, gateAnim + dt * 1.5);
  if (nervePulse >= 0) nervePulse = nervePulse < 1 ? nervePulse + dt : nervePulse;
  if (gameTime > ACID_START) {
    if (acidY === ACID_Y0) { fact('acid'); setTimeout(() => fact('mucus'), 7000); }
    acidY -= ACID_RATE * dt;
  }
  dripT -= dt;
  if (dripT <= 0 && ceilTiles.length) {
    dripT = .25 + Math.random() * .5;
    const [c, r] = pick(ceilTiles);
    parts.push({ x: c * T + 4 + Math.random() * 16, y: (r + 1) * T + 6, vx: 0, vy: 0, life: 2, max: 2,
      color: 'rgba(230,220,160,.85)', size: 2.2, grav: 420, drip: true });
  }
  if (Math.random() < .05) parts.push({ x: 2.5 * T + (Math.random() - .5) * 20, y: 4.4 * T, vx: 0, vy: 0, life: 1.5, max: 1.5, color: '#9e0f19', size: 2.5, grav: 500, drip: true });
  for (const p of parts) {
    p.vy += p.grav * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt;
    if (p.drip && (p.y > acidY || solidAt(Math.floor(p.x / T), Math.floor(p.y / T)))) p.life = 0;
  }
  parts = parts.filter(p => p.life > 0);
  for (const f of floats) { f.y -= 22 * dt; f.life -= dt; }
  floats = floats.filter(f => f.life > 0);

  // hints and win / lose
  const allHome = heroes.every(h => h.inExit);
  if (lost > RBC_TOTAL - RBC_NEED) return fail(`Too many blood cells were lost (${lost}). You need to save ${RBC_NEED} of ${RBC_TOTAL}.`);
  if (released && spawned === RBC_TOTAL && saved + lost === RBC_TOTAL) {
    if (allHome) return win();
    hint = 'All the blood cells are done. Now get every hero into the vein!';
  } else if (!released) hint = 'Clear the way first, then press R to release the blood cells.';
  else hint = 'Guide the blood cells to the vein. Heroes standing still make them turn around.';
}

// ---------- drawing: static layers ----------
const bgCanvas = document.createElement('canvas'); bgCanvas.width = W; bgCanvas.height = H;
const terrCanvas = document.createElement('canvas'); terrCanvas.width = W; terrCanvas.height = H;
function renderBackground() {
  const c = bgCanvas.getContext('2d');
  let g = c.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#3d0b12'); g.addColorStop(1, '#1c0306');
  c.fillStyle = g; c.fillRect(0, 0, W, H);
  // stomach folds (rugae)
  for (let i = 0; i < 16; i++) {
    c.strokeStyle = `rgba(${100 + hash(i, 9) * 30 | 0},20,32,${.12 + hash(i, 1) * .15})`;
    c.lineWidth = 8 + hash(i, 2) * 22; c.lineCap = 'round';
    const y = hash(i, 3) * H;
    c.beginPath(); c.moveTo(-30, y);
    for (let x = 0; x <= W + 60; x += 70) c.quadraticCurveTo(x + 35, y + (hash(i, x) - .5) * 90, x + 70, y + (hash(i, x + 7) - .5) * 40);
    c.stroke();
  }
  // veins
  function branch(x, y, a, len, w, d) {
    if (d > 5 || w < .6) return;
    const x2 = x + Math.cos(a) * len, y2 = y + Math.sin(a) * len;
    c.strokeStyle = `rgba(80,30,100,${.18 + w * .03})`; c.lineWidth = w;
    c.beginPath(); c.moveTo(x, y);
    c.quadraticCurveTo((x + x2) / 2 + Math.sin(d + a) * 12, (y + y2) / 2 + Math.cos(d) * 12, x2, y2); c.stroke();
    branch(x2, y2, a + .4 + hash(d, x | 0) * .4, len * .75, w * .7, d + 1);
    branch(x2, y2, a - .4 - hash(y | 0, d) * .4, len * .7, w * .65, d + 1);
  }
  for (let i = 0; i < 6; i++) branch(hash(i, 50) * W, hash(i, 51) * H, hash(i, 52) * 6.3, 60, 5, 0);
  // blobby cells in the wall
  for (let i = 0; i < 90; i++) {
    const x = hash(i, 70) * W, y = hash(i, 71) * H, r = 6 + hash(i, 72) * 18;
    g = c.createRadialGradient(x - r * .3, y - r * .3, 1, x, y, r);
    g.addColorStop(0, 'rgba(230,120,130,.10)'); g.addColorStop(1, 'rgba(120,20,30,0)');
    c.fillStyle = g; circle(c, x, y, r);
    c.fillStyle = 'rgba(70,10,30,.12)'; circle(c, x + r * .1, y, r * .25);
  }
  g = c.createRadialGradient(W / 2, H / 2, H * .3, W / 2, H / 2, W * .7);
  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,.55)');

}
function renderTerrain() {
  const c = terrCanvas.getContext('2d');
  c.clearRect(0, 0, W, H);
  ceilTiles = [];
  const isSolid = (x, y) => x < 0 || x >= COLS || y < 0 || (y < ROWS && (grid[y][x] === 1 || grid[y][x] === 2));
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
    const t = grid[y][x];
    if (t !== 1 && t !== 2) continue;
    const px = x * T, py = y * T;
    if (t === 1) {
      const l = 30 + hash(x, y) * 10;
      c.fillStyle = `hsl(352,48%,${l}%)`; c.fillRect(px, py, T, T);
      for (let i = 0; i < 4; i++) {
        c.fillStyle = `hsla(${345 + hash(x, y, i) * 15},50%,${25 + hash(y, x, i) * 20}%,.55)`;
        circle(c, px + hash(x, y, i + 9) * T, py + hash(x, y, i + 19) * T, 3 + hash(x, y, i + 29) * 7);
      }
      if (hash(x, y, 77) < .3) { c.strokeStyle = 'rgba(90,20,70,.45)'; c.lineWidth = 1.2; c.beginPath();
        c.moveTo(px, py + hash(x, y, 5) * T); c.quadraticCurveTo(px + 12, py + hash(x, y, 6) * T, px + T, py + hash(x, y, 8) * T); c.stroke(); }
    } else {
      c.fillStyle = '#4e0910'; c.fillRect(px, py, T, T);
      for (let i = 0; i < 5; i++) {
        c.fillStyle = '#a5131d';
        c.beginPath(); c.ellipse(px + 3 + hash(x, i, 3) * 18, py + 4 + hash(i, y, 4) * 16, 3.5, 2.4, hash(x, y, i) * 3, 0, 7); c.fill();
      }
      c.strokeStyle = 'rgba(240,215,190,.55)'; c.lineWidth = .8;
      for (let i = 0; i < 7; i++) {
        c.beginPath(); c.moveTo(px + hash(x, y, i) * T, py + hash(y, x, i) * T);
        c.lineTo(px + hash(x, y, i + 40) * T, py + hash(y, x, i + 40) * T); c.stroke();
      }
    }
    // darker rims where flesh meets open space
    c.fillStyle = 'rgba(40,0,8,.45)';
    if (!isSolid(x - 1, y)) c.fillRect(px, py, 3, T);
    if (!isSolid(x + 1, y)) c.fillRect(px + T - 3, py, 3, T);
    if (!isSolid(x, y + 1) && y < ROWS - 1) {
      c.fillRect(px, py + T - 3, T, 3);
      ceilTiles.push([x, y]);
      c.fillStyle = 'rgba(225,215,150,.8)';
      for (let i = 0; i < 2; i++) if (hash(x, y, i + 60) < .55) {
        const dx = px + 4 + hash(x, y, i + 61) * 16, len = 4 + hash(x, y, i + 62) * 10;
        c.beginPath(); c.moveTo(dx - 3, py + T); c.quadraticCurveTo(dx, py + T + len * 1.4, dx + 3, py + T); c.fill();
      }
      c.fillStyle = 'rgba(40,0,8,.45)';
    }
    // slimy mucus coating on top surfaces
    if (!isSolid(x, y - 1)) {
      c.fillStyle = t === 2 ? 'rgba(160,30,40,.9)' : 'rgba(228,216,150,.85)';
      c.beginPath(); c.moveTo(px, py - 1); c.lineTo(px + T, py - 1);
      for (let i = 4; i >= 0; i--) c.lineTo(px + i * T / 4, py + 3 + hash(x, y, i + 80) * 5);
      c.fill();
      if (hash(x, y, 90) < .4 && t === 1) { const dx = px + 5 + hash(x, y, 91) * 14;
        c.beginPath(); c.moveTo(dx - 3, py + 4); c.quadraticCurveTo(dx, py + 14 + hash(x, y, 92) * 6, dx + 3, py + 4); c.fill(); }
      c.strokeStyle = 'rgba(255,255,240,.55)'; c.lineWidth = 1.2;
      c.beginPath(); c.moveTo(px + 2, py + 1); c.lineTo(px + T - 4, py + 1); c.stroke();
    }
  }
}

    if (d <= segs[i] || i === segs.length - 1) {

}

  for (let i = 0; i < 7; i++) { c.beginPath(); c.moveTo(162 + i * 12, 38 + (i % 2) * 6); c.quadraticCurveTo(170 + i * 12, 58, 160 + i * 12, 76); c.stroke(); }
  c.beginPath(); c.moveTo(200, 30); c.lineTo(200, 83); c.stroke();
  // face
  c.fillStyle = 'rgba(40,20,20,.7)'; circle(c, 178, 100, 5); circle(c, 222, 100, 5);
  c.fillStyle = '#5a1a20'; c.beginPath(); c.ellipse(200, 130, 13, 6, 0, 0, Math.PI * 2); c.fill();
  // lungs and heart
  c.fillStyle = 'rgba(232,150,165,.85)';
  c.beginPath(); c.ellipse(152, 284, 34, 62, .08, 0, Math.PI * 2); c.fill();
  c.beginPath(); c.ellipse(250, 284, 32, 60, -.08, 0, Math.PI * 2); c.fill();
  c.fillStyle = '#c0222e'; c.beginPath(); c.moveTo(216, 322);
  c.bezierCurveTo(186, 300, 196, 272, 212, 280); c.bezierCurveTo(228, 268, 246, 290, 216, 322); c.fill();
  // liver
  c.fillStyle = '#8a3626'; c.beginPath(); c.ellipse(168, 352, 54, 26, .18, 0, Math.PI * 2); c.fill();
  // oesophagus
  c.strokeStyle = '#c96a72'; c.lineWidth = 11; c.lineCap = 'round';
  c.beginPath(); c.moveTo(200, 140); c.lineTo(201, 200); c.quadraticCurveTo(204, 280, 206, 330); c.stroke();
  c.strokeStyle = 'rgba(120,30,40,.5)'; c.lineWidth = 1.2 / Math.sqrt(z);
  for (let y = 150; y < 326; y += 8) { c.beginPath(); c.moveTo(195, y); c.lineTo(211, y + 1); c.stroke(); }
  // stomach (J-shape)
  c.fillStyle = '#d4747c'; c.strokeStyle = '#8e2f3a'; c.lineWidth = 2 / Math.sqrt(z);
  c.beginPath(); c.moveTo(204, 328);
  c.bezierCurveTo(230, 322, 272, 335, 270, 368); c.bezierCurveTo(268, 398, 235, 410, 205, 402);
  c.bezierCurveTo(192, 398, 184, 390, 182, 382); c.lineTo(190, 377);
  c.bezierCurveTo(205, 386, 232, 384, 238, 366); c.bezierCurveTo(242, 350, 226, 342, 212, 338); c.closePath();
  c.fill(); c.stroke();
  c.strokeStyle = 'rgba(140,40,55,.55)'; c.lineWidth = 1.2 / Math.sqrt(z);
  for (let i = 0; i < 5; i++) { c.beginPath(); c.moveTo(244 + i * 4, 345 + i * 3); c.quadraticCurveTo(262, 370 + i * 3, 228 + i * 2, 396 - i); c.stroke(); }
  // the ulcer, with germs
  c.fillStyle = '#5c0710'; c.beginPath(); c.ellipse(254, 372, 4.2, 3.2, .4, 0, Math.PI * 2); c.fill();
  c.fillStyle = 'rgba(200,30,40,.8)'; c.beginPath(); c.ellipse(254, 372, 2.4, 1.6, .4, 0, Math.PI * 2); c.fill();
  c.fillStyle = '#9bc43a'; for (let i = 0; i < 7; i++) { const w = i * 2.4 + Math.sin(anim * 3 + i) * .25; circle(c, 254 + Math.cos(w) * 4.6, 372 + Math.sin(w) * 3.6, .55); }
  // intestines
  c.strokeStyle = '#d99a72'; c.lineWidth = 12; c.lineCap = 'round';
  c.beginPath(); c.moveTo(150, 485); c.lineTo(148, 420); c.quadraticCurveTo(150, 410, 165, 412); c.lineTo(238, 412);
  c.quadraticCurveTo(254, 410, 254, 425); c.lineTo(252, 486); c.stroke();
  c.strokeStyle = '#e8b48c'; c.lineWidth = 7;
  c.beginPath(); c.moveTo(170, 432);
  for (let i = 0; i < 6; i++) c.bezierCurveTo(235, 432 + i * 9, 235, 437 + i * 9, 170, 441 + i * 9);
  c.stroke();
  c.fillStyle = 'rgba(240,210,120,.6)'; c.beginPath(); c.ellipse(200, 505, 16, 11, 0, 0, Math.PI * 2); c.fill();
}
function flyRender(dt) {
  const c = flyC, r = FLY_ROUTE[fly.k];
  fly.t += dt;
  if (r) {
    const u = ease(Math.min(1, fly.t / TWEEN));
    const [tx, ty, tz] = r.cam;
    fly.cam.x = fly.from.x + (tx - fly.from.x) * u;
    fly.cam.y = fly.from.y + (ty - fly.from.y) * u;
    fly.cam.z = Math.exp(Math.log(fly.from.z) + (Math.log(tz) - Math.log(fly.from.z)) * u);
    fly.ship = alongPath(r.path, u);
    if (fly.t > TWEEN + 1 && (fly.spoke || fly.t > TWEEN + fly.wait + (fly.voiced ? 4 : 0))) flyGo(fly.k + 1);
    if (!fly.on) return;
  } else { fly.cam.x = 20; fly.cam.y = 420 + Math.sin(anim * .6) * 8; }
  const z = fly.cam.z, s = BODY_FIT * z;
  c.setTransform(1, 0, 0, 1, 0, 0);
  const bg = c.createRadialGradient(480, 264, 50, 480, 264, 600);
  bg.addColorStop(0, '#1c1430'); bg.addColorStop(1, '#05030a');
  c.fillStyle = bg; c.fillRect(0, 0, W, H);
  c.fillStyle = 'rgba(200,190,255,.35)';
  for (let i = 0; i < 70; i++) circle(c, (hash(i, 1) * W + anim * (4 + hash(i, 2) * 8)) % W, hash(i, 3) * H, .6 + hash(i, 4));
  c.setTransform(s, 0, 0, s, W / 2 - fly.cam.x * s, H / 2 - fly.cam.y * s);
  drawBody(c, z);
  // ship and its glowing trail, drawn in screen space
  c.setTransform(1, 0, 0, 1, 0, 0);
  const toScreen = ([x, y]) => [W / 2 + (x - fly.cam.x) * s, H / 2 + (y - fly.cam.y) * s];
  if (fly.k >= 0) {
    const [sx, sy] = toScreen(fly.ship);
    fly.trail.push([sx, sy]); if (fly.trail.length > 24) fly.trail.shift();
    fly.trail.forEach(([x, y], i) => { c.fillStyle = `rgba(120,230,255,${i / fly.trail.length * .5})`; circle(c, x, y, 1 + i / 8); });
    c.shadowColor = '#7fe6ff'; c.shadowBlur = 16;
    c.fillStyle = '#e8fbff'; c.beginPath(); c.ellipse(sx, sy, 7, 4, 0, 0, Math.PI * 2); c.fill();
    c.shadowBlur = 0; c.fillStyle = '#2b9fd6'; circle(c, sx + 2, sy - .5, 2);
  }
  // organ labels
  c.font = 'bold 14px Trebuchet MS'; c.textAlign = 'left'; c.textBaseline = 'middle';
  const lab = r ? r.labels : [];
  const la = r ? Math.min(1, Math.max(0, (fly.t - TWEEN * .8) / .6)) : 1;
  for (const name of lab) {
    const [ox, oy] = toScreen(ORGANS[name]);
    const right = ORGANS[name][0] >= 200, lx = ox + (right ? 70 : -70);
    c.globalAlpha = la; c.strokeStyle = 'rgba(255,240,200,.8)'; c.lineWidth = 1.2;
    c.beginPath(); c.moveTo(ox, oy); c.lineTo(lx, oy - 18); c.stroke();
    c.fillStyle = '#ffe9b0'; c.textAlign = right ? 'left' : 'right';
    c.fillText(name, lx + (right ? 4 : -4), oy - 18);
  }
  c.globalAlpha = 1;
  if (r && r.fade) {
    const f = clamp((fly.t - TWEEN * .55) / (TWEEN * .45), 0, 1);
    c.fillStyle = `rgba(61,11,18,${f})`; c.fillRect(0, 0, W, H);
  }
}
let flyLast = performance.now();
(function flyLoop(now) {
  const dt = Math.min(.1, (now - flyLast) / 1000); flyLast = now;
  if (fly.on) { flyRender(dt); requestAnimationFrame(flyLoop); }
})(flyLast);

// ---------- glossary ----------
const glossEl = document.getElementById('gloss');
document.getElementById('glossList').innerHTML = Object.keys(GLOSS).map(k => `<div data-k="${k}">${glossHTML(k)}</div>`).join('');
document.getElementById('glossList').onclick = e => {
  const d = e.target.closest('[data-k]');
  if (d) speak(`${d.dataset.k}. ${GLOSS[d.dataset.k][1]}`, true);
};
function openGloss() {
  if (mathCtx) return;
  glossEl.classList.add('show'); paused = true;
}
function closeGloss() {
  glossEl.classList.remove('show'); hush();
  paused = !started || ended || !!mathCtx;
}
document.getElementById('btnWords').onclick = e => { e.target.blur(); openGloss(); };
document.getElementById('btnGlossClose').onclick = closeGloss;

// ---------- input ----------
const KEYMAP = { ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right' };
addEventListener('keydown', e => {
  ensureAudio();
  if (mathCtx) {
    if (/^Digit\d$|^Numpad\d$/.test(e.code)) mathKey(e.code.slice(-1));
    else if (e.key === 'Backspace') mathKey('del');
    else if (e.key === 'Enter') mathKey('ok');
    else if (e.key === 'Escape') closeMath(null);
    e.preventDefault(); return;
  }
  if (glossEl.classList.contains('show')) {
    if (e.key === 'Escape' || e.key === 'Enter') { e.preventDefault(); closeGloss(); }
    return;
  }
  if (fly.on) {
    if (e.key === 'Escape') flyEnd();
    else if (e.key === 'Enter' || e.key === 'ArrowRight') {
      e.preventDefault();
      if (fly.k < 0) document.getElementById('btnJourney').click(); else flyGo(fly.k + 1);
    }
    return;
  }
  if (!started) {
    if (e.key === 'Enter' || e.key === 'ArrowRight') { e.preventDefault(); document.getElementById('btnNext').click(); }
    if (e.key === 'ArrowLeft' && page) { e.preventDefault(); showPage(page - 1, true); }
    return;
  }
  if (ended) {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); document.getElementById('btnAgain').click(); }
    return;
  }
  if (KEYMAP[e.code]) { keys[KEYMAP[e.code]] = true; e.preventDefault(); }
  if (['Space', 'ArrowUp', 'KeyW'].includes(e.code)) { if (!e.repeat) jumpQ = true; e.preventDefault(); }
  if (e.code === 'KeyE' || e.code === 'Enter') { if (!e.repeat) powerQ = true; e.preventDefault(); }
  if (['Digit1', 'Digit2', 'Digit3'].includes(e.code)) { active = +e.code.slice(-1) - 1; sfx('switch'); }
  if (e.code === 'Tab') { active = (active + (e.shiftKey ? 2 : 1)) % 3; sfx('switch'); e.preventDefault(); }
  if (e.code === 'KeyR' && !released) { released = true; spawnT = 0; say(heroes[active], 'Here they come!', '#ffb0b0'); fact('ulcer'); }
});
addEventListener('keyup', e => { if (KEYMAP[e.code]) keys[KEYMAP[e.code]] = false; });
addEventListener('blur', () => { keys.left = keys.right = false; });

document.getElementById('btnHelp').onclick = showHelp;
document.getElementById('btnHear').onclick = () => {
  if (!mathCtx) return;
  ensureAudio();
  const on = readAloud; readAloud = 'speechSynthesis' in window;
  speak(questionSpeech(mathCtx.p) + (helpEl.classList.contains('show') ? '. ' + helpEl.innerHTML : ''), true);
  readAloud = on;
};
document.getElementById('btnGotIt').onclick = () => mathKey('ok');
document.getElementById('btnAgain').onclick = () => {
  endEl.classList.remove('show'); resetLevel(); paused = false;
};
document.getElementById('btnRestart').onclick = e => {
  e.target.blur();
  if (mathCtx) return;
  endEl.classList.remove('show'); resetLevel(); paused = !started;
};
document.getElementById('btnSound').onclick = e => {
  muted = !muted; e.target.textContent = 'Sound: ' + (muted ? 'off' : 'on'); e.target.blur();
};
const btnRead = document.getElementById('btnRead');
if (!('speechSynthesis' in window)) btnRead.hidden = true;
btnRead.onclick = e => {
  readAloud = !readAloud; if (!readAloud) hush();
  btnRead.textContent = '🔊 Read aloud: ' + (readAloud ? 'on' : 'off'); e.target.blur();
};

// ---------- layout ----------
function fit() {
  const s = Math.min(innerWidth / W, innerHeight / H);
  const st = document.getElementById('stage');
  st.style.width = W * s + 'px'; st.style.height = H * s + 'px'; st.style.fontSize = 16 * s + 'px';
}
addEventListener('resize', fit);

// ---------- boot ----------
renderBackground();
resetLevel();
fit();
showPage(0, false);
requestAnimationFrame(frame);
</script>
