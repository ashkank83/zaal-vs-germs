<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#0d0204">
<title>Zaal vs Germs</title>
<style>
  html, body { margin: 0; height: 100%; background: #0d0204; color: #f3e6d8;
    font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif; overflow: hidden;
    overscroll-behavior: none; touch-action: manipulation; -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-text-size-adjust: 100%; }
  input { -webkit-user-select: text; user-select: text; }
  #wrap { width: 100vw; height: 100vh; height: 100dvh; display: flex; align-items: center; justify-content: center; box-sizing: border-box; }
  #stage { position: relative; box-shadow: 0 0 60px rgba(160, 20, 30, .35); }
  #game { display: block; width: 100%; height: 100%; }
  .overlay { position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
    background: rgba(18, 2, 6, .78); z-index: 5; }
  .overlay.show { display: flex; }
  .panel { background: linear-gradient(#3b0c14, #24060b); border: .15em solid #a8323f; border-radius: 1em;
    padding: 1.1em 1.5em; max-width: 46em; box-shadow: 0 .4em 2em rgba(0,0,0,.6); text-align: center; }
  h1 { margin: 0; font-size: 2.6em; letter-spacing: .05em; color: #d7ef6a;
    text-shadow: 0 .08em 0 #3d5a10, 0 0 .5em rgba(190, 230, 60, .4); }
  h2 { margin: .1em 0 .5em; font-size: 1.2em; color: #f2a0a6; font-weight: normal; }
  p { margin: .4em 0; line-height: 1.35; font-size: .95em; }
  .team { display: flex; gap: .8em; justify-content: center; margin: .7em 0; }
  .card { background: rgba(0,0,0,.25); border: .08em solid #6e1f2a; border-radius: .6em; padding: .4em .6em; width: 12em; }
  .card img { width: 4em; height: 4em; display: block; margin: 0 auto; }
  .card > b { color: #ffd88a; display: block; }
  .card > span { font-size: .78em; line-height: 1.3; display: block; }
  .story { width: 40em; min-height: 22em; display: flex; flex-direction: column; }
  #storyBody { flex: 1; text-align: left; }
  #storyBody h1, #storyBody h2 { text-align: center; }
  #storyBody .team { text-align: center; }
  #storyBody ul { margin: .3em 0; padding-left: 1.3em; font-size: .92em; line-height: 1.4; }
  .pics { display: flex; justify-content: center; gap: 1em; }
  .pics img { width: 4.5em; height: 4.5em; }
  .w { color: #ffd88a; border-bottom: .12em dotted #ffd88a; cursor: pointer; }
  @media (hover: hover) { .w:hover { background: rgba(255, 216, 138, .15); } }
  .w:active { background: rgba(255, 216, 138, .25); }
  .pron { color: #c9a9a0; font-size: .85em; font-style: italic; }
  #wordTip { min-height: 2.6em; margin-top: .4em; font-size: .85em; background: rgba(0,0,0,.3); border-radius: .5em;
    padding: .35em .7em; text-align: left; color: #f3e6d8; }
  #wordTip:empty { visibility: hidden; }
  .nav { display: flex; align-items: center; gap: .5em; margin-top: .4em; }
  .nav .go { margin: 0 0 0 auto; }
  #storyDots { flex: 1; text-align: center; color: #a8323f; letter-spacing: .2em; }
  .sec { background: rgba(243, 230, 216, .15); color: #f3e6d8; padding: .35em .8em; border: .08em solid #a8323f; }
  @media (hover: hover) { .sec:hover { background: rgba(243, 230, 216, .25); } }
  .sec:active { background: rgba(243, 230, 216, .3); }
  .tip { font-size: .8em; color: #c9a9a0; text-align: center; }
  .mathGrid { display: flex; gap: 1.2em; align-items: stretch; }
  .mrow { display: flex; gap: .4em; justify-content: center; margin: .3em 0; }
  .mrow .go { margin: 0; font-size: 1.05em; padding: .3em 1em; }
  #mathHelp { display: none; width: 21em; max-height: 25em; overflow: auto; text-align: left; background: rgba(0,0,0,.3);
    border-radius: .6em; padding: .5em .8em; font-size: .9em; }
  #mathHelp.show { display: block; }
  #mathHelp p { margin: .35em 0; }
  #mathHelp .steps { font-size: 1.1em; font-weight: bold; color: #fff; }
  #mathHelp .count { color: #d7ef6a; font-weight: bold; }
  #mathHelp .ans { color: #c7e04f; font-size: 1.2em; }
  #mathHelp .tipbox { background: rgba(199, 224, 79, .12); border-left: .25em solid #c7e04f; padding: .25em .5em; border-radius: .3em; }
  .pic { display: flex; flex-wrap: wrap; gap: .25em; align-items: center; margin: .3em 0; }
  .grp { display: inline-flex; flex-wrap: wrap; gap: .15em; border: .1em dashed #f2a0a6; border-radius: .4em; padding: .2em; max-width: 7em; }
  .d { display: inline-block; width: .7em; height: .7em; border-radius: 50%; background: #e2323a; box-shadow: inset -.1em -.1em 0 rgba(0,0,0,.3); }
  .d.g { background: #8ca33a; }
  .d.o { background: none; border: .1em solid #8ca33a; box-sizing: border-box; }
  .d.x { background: #555; position: relative; opacity: .55; }
  .d.x::after { content: '×'; position: absolute; inset: -.35em 0 0 0; text-align: center; color: #fff; font-size: .9em; font-weight: bold; }
  .op { font-size: 1.3em; font-weight: bold; margin: 0 .2em; }
  #glossList { text-align: left; max-height: 22em; overflow: auto; font-size: .85em; columns: 2; column-gap: 1.5em; }
  #glossList div { break-inside: avoid; margin-bottom: .45em; cursor: pointer; }
  @media (hover: hover) { #glossList div:hover b { text-decoration: underline; } }
  #glossList b { color: #ffd88a; }
  .keys { font-size: .85em; color: #e8c9c0; margin-top: .4em; }
  kbd { background: #f3e6d8; color: #2b070c; border-radius: .25em; padding: 0 .35em; font-family: inherit; font-weight: bold; }
  button { font: inherit; cursor: pointer; border: none; border-radius: .5em; }
  .go { margin-top: .7em; font-size: 1.3em; padding: .4em 1.4em; background: #c7e04f; color: #23360a; font-weight: bold;
    box-shadow: 0 .2em 0 #6d8a1c; }
  .go:active { transform: translateY(.15em); box-shadow: none; }
  #mathWho { color: #ffd88a; font-size: 1.05em; margin-bottom: .3em; }
  #mathQ { font-size: 2.6em; font-weight: bold; margin: .2em 0; color: #fff; }
  #mathA { font-size: 2em; min-width: 4em; display: inline-block; background: #120306; border: .1em solid #a8323f;
    border-radius: .3em; padding: .05em .4em; min-height: 1.2em; color: #d7ef6a; }
  #pad { display: grid; grid-template-columns: repeat(3, 3.2em); gap: .35em; justify-content: center; margin: .6em 0; }
  #pad button { font-size: 1.3em; padding: .35em 0; background: #f3e6d8; color: #2b070c; font-weight: bold; }
  #pad button.ok { background: #c7e04f; color: #23360a; }
  #pad button.del { background: #e8a0a0; }
  #mathMsg { min-height: 1.4em; font-size: 1.1em; font-weight: bold; }
  #mathStars { color: #ffd88a; font-size: .85em; }
  #facts { position: absolute; left: 1%; bottom: 7%; width: 52%; display: flex; flex-direction: column; gap: .3em;
    pointer-events: none; z-index: 3; }
  .fact { background: rgba(20, 40, 10, .88); border-left: .3em solid #c7e04f; border-radius: .4em; padding: .35em .6em;
    font-size: .8em; line-height: 1.3; animation: pop .3s ease-out; }
  .fact b { color: #d7ef6a; }
  @keyframes pop { from { transform: translateY(1em); opacity: 0; } to { transform: none; opacity: 1; } }
  #tools { position: absolute; right: .5%; bottom: .6%; display: flex; gap: .3em; z-index: 4; }
  #tools button { font-size: .7em; padding: .25em .6em; background: rgba(243, 230, 216, .9); color: #2b070c; }
  #endList { text-align: left; font-size: .8em; max-height: 13em; overflow: auto; margin: .5em 0;
    background: rgba(0,0,0,.25); border-radius: .5em; padding: .4em .8em; }
  #endList li { margin: .2em 0; }
  [hidden] { display: none !important; }
  #fly { background: #07040c; z-index: 6; }
  #flyCvs { position: absolute; inset: 0; width: 100%; height: 100%; }
  #flyCap { position: absolute; left: 50%; bottom: 4%; transform: translateX(-50%); width: 70%; background: rgba(20, 4, 10, .85);
    border: .12em solid #a8323f; border-radius: .8em; padding: .6em 1em; font-size: 1.05em; line-height: 1.4; text-align: center; }
  #flyCap:empty { display: none; }
  #flyBtns { position: absolute; right: 1.5%; top: 2.5%; display: flex; gap: .4em; }
  #flyTitle { position: absolute; left: 24%; top: 50%; transform: translate(-50%, -50%); text-align: center; }
  #flyTitle .go { font-size: 1.5em; }
  #flyBtns .sec { background: rgba(20, 4, 10, .75); }
  #end .panel { max-height: 94%; overflow: auto; box-sizing: border-box; padding: .8em 1.5em; }
  #end h1 { font-size: 2.2em; }
  #endArt:not([hidden]) ~ #endList { max-height: 7em; }
  #facts.lv1 { left: 26%; bottom: auto; top: 9%; width: 44%; }    /* level 1's heroes start bottom-left */
  #facts.lv2 { left: auto; right: 1%; bottom: auto; top: 22%; width: 46%; }   /* level 2's action starts bottom-left */
  #facts.lv4 { left: auto; right: 1%; bottom: auto; top: 22%; width: 40%; }   /* and level 4 */
  #facts.lv3 { left: auto; right: 1%; bottom: auto; top: 22%; width: 40%; }   /* level 3 too */
  #codeRow { margin-top: .9em; font-size: .9em; }
  #codeIn { font: inherit; font-size: 1.3em; width: 4.2em; text-align: center; text-transform: uppercase; letter-spacing: .15em;
    background: #120306; color: #d7ef6a; border: .1em solid #a8323f; border-radius: .3em; padding: .1em .2em; }
  #codeMsg { min-height: 1.3em; margin-top: .3em; color: #ffd88a; font-size: .9em; }
  #endCode { display: block; width: fit-content; margin: .3em auto; padding: .35em 1.2em; background: rgba(0,0,0,.35);
    border: .12em dashed #ffd88a; border-radius: .6em; font-size: .9em; }
  #endCode b { display: block; font-size: 2.2em; letter-spacing: .3em; color: #d7ef6a; margin: .05em 0 0 .3em; }
  #endCode .tip { display: block; }
  #endArt { display: block; width: 32em; height: 7.5em; margin: .2em auto; }
  #brainSays { position: absolute; left: 50%; top: 6%; transform: translateX(-50%); max-width: 60%; z-index: 3; pointer-events: none;
    background: rgba(255, 236, 245, .95); color: #4a1030; border: .12em solid #c0507a; border-radius: 1em; padding: .35em .9em;
    font-size: .95em; font-weight: bold; text-align: center; animation: pop .3s ease-out; }
  #brainSays:empty { display: none; }
  /* ---- touch controls (tablets and phones) ---- */
  #touch { display: none; }
  body.touch #touch.show { display: block; }
  #touch button, #dpad { position: fixed; touch-action: none; z-index: 20; font-family: inherit; font-weight: bold;
    color: #2b070c; background: rgba(243, 230, 216, .88); border: .12em solid rgba(255,255,255,.7); border-radius: 50%;
    box-shadow: 0 .25em 0 rgba(0,0,0,.45); display: flex; flex-direction: column; align-items: center; justify-content: center; }
  #touch .down, #dpad.l .tl, #dpad.r .tr { transform: translateY(.15em); box-shadow: none; filter: brightness(1.15); }
  #dpad { left: calc(env(safe-area-inset-left, 0px) + var(--cs) * .25); bottom: calc(env(safe-area-inset-bottom, 0px) + var(--cs) * .3);
    width: calc(var(--cs) * 2.4); height: calc(var(--cs) * 1.15); border-radius: calc(var(--cs) * .58);
    flex-direction: row; padding: 0; overflow: hidden; background: rgba(243, 230, 216, .25); }
  #dpad span { flex: 1; height: 100%; display: flex; align-items: center; justify-content: center; font-size: calc(var(--cs) * .55);
    background: rgba(243, 230, 216, .88); margin: .1em; border-radius: calc(var(--cs) * .5); }
  #touch #tJump { right: calc(env(safe-area-inset-right, 0px) + var(--cs) * .25); bottom: calc(env(safe-area-inset-bottom, 0px) + var(--cs) * .3 + var(--lift, 0px));
    width: calc(var(--cs) * 1.25); height: calc(var(--cs) * 1.25); font-size: calc(var(--cs) * .6); background: rgba(199, 224, 79, .92); color: #23360a; }
  #touch #tPower { right: calc(env(safe-area-inset-right, 0px) + var(--cs) * 1.6); bottom: calc(env(safe-area-inset-bottom, 0px) + var(--cs) * .3 + var(--lift, 0px));
    width: calc(var(--cs) * 1.1); height: calc(var(--cs) * 1.1); font-size: calc(var(--cs) * .45); background: rgba(255, 216, 138, .95); }
  #tPower small, #tJump small { font-size: .4em; line-height: 1; }
  #touch #tSwitch { right: calc(env(safe-area-inset-right, 0px) + var(--cs) * .45); bottom: calc(env(safe-area-inset-bottom, 0px) + var(--cs) * 1.75 + var(--lift, 0px));
    width: calc(var(--cs) * .85); height: calc(var(--cs) * .85); font-size: calc(var(--cs) * .4); }
  #touch #tRelease { right: calc(env(safe-area-inset-right, 0px) + var(--cs) * .25); bottom: calc(env(safe-area-inset-bottom, 0px) + var(--cs) * 2.85 + var(--lift, 0px));
    width: calc(var(--cs) * 2.5); min-height: calc(var(--cs) * .75); border-radius: calc(var(--cs) * .38); padding: .2em calc(var(--cs) * .2);
    font-size: calc(var(--cs) * .27); line-height: 1.15; background: rgba(255, 138, 138, .95); animation: nudge 1.4s ease-in-out infinite; }
  @keyframes nudge { 50% { scale: 1.07; } }
  /* With room below the game: one row of buttons on each side, and the release button and tool buttons in the middle. */
  body[data-layout="below"] #touch #tSwitch { right: calc(env(safe-area-inset-right, 0px) + var(--cs) * 2.9); bottom: calc(env(safe-area-inset-bottom, 0px) + var(--cs) * .45); }
  body[data-layout="below"] #touch #tRelease { right: auto; left: 50%; transform: translateX(-50%); width: auto; white-space: nowrap;
    bottom: calc(env(safe-area-inset-bottom, 0px) + var(--cs) * .3); padding: 0 calc(var(--cs) * .35); font-size: calc(var(--cs) * .3); }
  body.touch[data-layout="below"] #tools { top: 100%; bottom: auto; right: 50%; transform: translateX(50%); margin-top: .5em; }
  body.touch #tools button { padding: .4em .7em; }
  body.touch #pad { grid-template-columns: repeat(3, 3.8em); gap: .45em; }
  body.touch #pad button { font-size: 1.5em; padding: .3em 0; }
  /* With no room beside or below the game, the buttons float over it and go see-through. */
  body[data-layout="over"] #touch button, body[data-layout="over"] #dpad span { opacity: .55; }
  body[data-layout="over"] #touch .down { opacity: .9; }
  #rotate { display: none; position: fixed; inset: 0; z-index: 50; background: #0d0204; color: #f3e6d8;
    flex-direction: column; align-items: center; justify-content: center; text-align: center; font-size: 1.4em; padding: 1em; }
  #rotate b { font-size: 3em; display: block; animation: turn 2s ease-in-out infinite; }
  @keyframes turn { 0%, 30% { transform: rotate(0); } 60%, 100% { transform: rotate(-90deg); } }
  @media (orientation: portrait) { body.touch #rotate { display: flex; } }
  #brainSays::before { content: '🧠 BRAIN (upstairs): '; color: #c0507a; }
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <canvas id="game" width="960" height="528"></canvas>
    <div id="facts"></div>
    <div id="brainSays"></div>
    <div id="tools">
      <button id="btnWords">📖 Body words</button>
      <button id="btnRead">🔊 Read aloud: on</button>
      <button id="btnSound">Sound: on</button>
      <button id="btnRestart">Restart level</button>
      <button id="btnFull" hidden>⛶ Full screen</button>
    </div>

    <div id="fly" class="overlay show">
      <canvas id="flyCvs" width="960" height="528"></canvas>
      <div id="flyTitle">
        <h1>ZAAL vs GERMS</h1>
        <h2>Level 1 · The Bleeding Ulcer</h2>
        <button class="go" id="btnJourney">▶ Start the journey</button>
        <div id="codeRow">
          <button class="sec" id="btnCode">🔑 Enter code</button>
          <span id="codeBox" hidden><input id="codeIn" maxlength="4" autocomplete="off" spellcheck="false" placeholder="CODE">
            <button class="sec" id="btnCodeGo">Go ▶</button></span>
          <div id="codeMsg"></div>
        </div>
      </div>
      <div id="flyCap"></div>
      <div id="flyBtns" hidden>
        <button class="sec" id="btnFlyNext">Next ▶</button>
        <button class="sec" id="btnFlySkip">Skip ⏭</button>
      </div>
    </div>

    <div id="intro" class="overlay">
      <div class="panel story">
        <div id="storyBody"></div>
        <div id="wordTip"></div>
        <div class="nav">
          <button class="sec" id="btnBack">◀ Back</button>
          <button class="sec" id="btnReadPage">🔊 Read to me</button>
          <span id="storyDots"></span>
          <button class="go" id="btnNext">Next ▶</button>
        </div>
      </div>
    </div>

    <div id="math" class="overlay">
      <div class="panel mathGrid">
        <div>
          <div id="mathWho"></div>
          <div id="mathQ"></div>
          <div id="mathA"></div>
          <div id="pad"></div>
          <div id="mathMsg"></div>
          <div class="mrow">
            <button class="sec" id="btnHelp">💡 Show me how</button>
            <button class="sec" id="btnHear">🔊 Hear it</button>
            <button class="go" id="btnGotIt" hidden>Got it!</button>
          </div>
          <div id="mathStars"></div>
        </div>
        <div id="mathHelp"></div>
      </div>
    </div>

    <div id="gloss" class="overlay">
      <div class="panel" style="width:40em">
        <h2>📖 Body words</h2>
        <p class="tip">Tap a word to hear it.</p>
        <div id="glossList"></div>
        <button class="go" id="btnGlossClose">Back to the game</button>
      </div>
    </div>

    <div id="end" class="overlay">
      <div class="panel">
        <h1 id="endTitle"></h1>
        <canvas id="endArt" width="640" height="150" hidden></canvas>
        <p id="endText"></p>
        <div id="endCode" hidden></div>
        <ul id="endList"></ul>
        <button class="go" id="btnAgain">Play again</button>
        <button class="go" id="btnNextLevel" hidden>Next level ▶</button>
      </div>
    </div>
  </div>
</div>


<div id="touch">
  <div id="dpad"><span class="tl">◀</span><span class="tr">▶</span></div>
  <button id="tRelease" hidden>🚪 Release</button>
  <button id="tSwitch">🔄</button>
  <button id="tPower">⚡<small id="tPowerName"></small></button>
  <button id="tJump">⤒<small>jump</small></button>
</div>
<div id="rotate"><b>📱</b>Turn your tablet sideways to play!</div>

<script src="voice/index.js"></script>
<script src="engine.js"></script>
<script src="level1.js"></script>
<script src="level2.js"></script>
<script src="level3.js"></script>
<script src="level4.js"></script>
<script>boot();</script>
</body>
</html>
